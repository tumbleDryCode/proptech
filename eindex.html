<html>
<head>
<title>about blank</title>
<script type="text/javascript">
function doEIload() {
tref = document.location.href;
tpid = "index_main";
tpu = "pid=index_main";
tmpcurrUrlArr = null;
if(!parent || !parent.JSSHOP || !parent.JSSHOP.shared || !parent.JSSHOP.ajax) {
return;
}
if(tref.indexOf("?") != -1) {
tpu = tref.substring(tref.indexOf("?") + 1, tref.length);
tmpcurrUrlArr = parent.JSSHOP.shared.urlToArray(tref); 
if(tmpcurrUrlArr.pid){
switch(tmpcurrUrlArr.pid) {
case "aa-contactus":
break;
default:
tpid = tmpcurrUrlArr.pid;
parent.JSSHOP.ajax.doAjaxGVals(tpid,tpu);
break;
}
} else if(tmpcurrUrlArr.content){
parent.JSSHOP.ajax.doAjaxGVals("content",tpu);
} else {
parent.JSSHOP.ajax.doAjaxGVals("noQvalue",tpu);
}
}
}
</script>
</head>
<body style="border:0px;margin:0px;padding:0px;">
<script type="text/javascript">
doEIload();
</script>
</body>
</html>
